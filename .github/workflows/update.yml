name: Update Samsung TV Plus ES

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Samsung TV Plus Spain playlist
        run: |
          curl -fL --retry 3 \
            "https://jmp2.uk/sam-ES.m3u" \
            -o samsung_tv_plus_es.m3u

          test -s samsung_tv_plus_es.m3u
          grep -q "#EXTM3U" samsung_tv_plus_es.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samsung_tv_plus_es.m3u
          git diff --cached --quiet || git commit -m "Update Samsung TV Plus ES"
          git push